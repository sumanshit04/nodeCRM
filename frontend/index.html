<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse CRM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app-shell">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary d-lg-none" id="menuToggle" type="button">
          <i class="bi bi-list"></i>
        </button>
        <div class="brand-mark">PC</div>
        <strong>Pulse CRM</strong>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small" id="profileLabel"></span>
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div id="pageLoader" class="text-center py-5 d-none">
        <div class="spinner-border text-primary"></div>
      </div>
      <div id="pageContent"></div>
    </main>
    <div class="toast-stack" id="toastStack"></div>

    <div class="modal fade" id="formModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="formModalTitle"></h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="formModalBody"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="confirmModalBody">Are you sure?</div>
          <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-danger" id="confirmOk">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/js/validators.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
